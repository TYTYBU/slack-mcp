[project]
name = "slack-mcp"
version = "0.1.0"
description = "Local stdio MCP server for reading/writing multiple Slack workspaces via user tokens."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "slack_sdk>=3.27.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[project.scripts]
slack-mcp = "slack_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_mcp"]
